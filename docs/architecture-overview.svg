<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 700 14px Arial, sans-serif; fill: #486581; }
      .layer-title { font: 700 22px Arial, sans-serif; fill: #102a43; }
      .group-label { font: 700 17px Arial, sans-serif; fill: #243b53; }
      .text { font: 600 16px Arial, sans-serif; fill: #243b53; }
      .small { font: 700 14px Arial, sans-serif; fill: #486581; }
      .platform { fill: #f4f7fb; stroke: #102a43; stroke-width: 3; rx: 18; ry: 18; }
      .layer { fill: #fbfdff; stroke: #334e68; stroke-width: 2.4; rx: 16; ry: 16; }
      .panel { fill: #f8fbff; stroke: #829ab1; stroke-width: 1.8; rx: 12; ry: 12; }
      .card { fill: #ffffff; stroke: #486581; stroke-width: 1.8; rx: 10; ry: 10; }
      .uml-stroke { stroke: #334e68; stroke-width: 2.2; fill: none; }
      .db-fill { fill: #ffffff; stroke: #486581; stroke-width: 1.8; }
      .arrow-public { stroke: #2f6f5e; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead-public); }
      .arrow-admin { stroke: #8b2e3c; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead-admin); }
      .arrow-system { stroke: #334e68; stroke-width: 2.1; fill: none; marker-end: url(#arrowhead-system); }
    </style>
    <marker id="arrowhead-public" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f6f5e"/>
    </marker>
    <marker id="arrowhead-admin" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b2e3c"/>
    </marker>
    <marker id="arrowhead-system" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334e68"/>
    </marker>
