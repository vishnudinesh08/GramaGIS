  <text x="725" y="626" text-anchor="middle" class="text">Feedback API</text>

  <rect x="830" y="580" width="150" height="84" class="card"/>
  <text x="905" y="626" text-anchor="middle" class="text">Query API</text>

  <rect x="1010" y="580" width="150" height="84" class="card"/>
  <text x="1085" y="626" text-anchor="middle" class="text">Geo Proxy API</text>

  <rect x="90" y="760" width="1220" height="205" class="layer"/>
  <text x="700" y="790" text-anchor="middle" class="layer-title">Service Layer</text>

  <rect x="180" y="823" width="460" height="102" class="panel"/>
  <text x="410" y="852" text-anchor="middle" class="group-label">Spatial Service</text>
  <rect x="300" y="870" width="220" height="40" class="card"/>
