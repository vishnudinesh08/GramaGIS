  <text x="700" y="1050" text-anchor="middle" class="layer-title">Database Layer</text>
  <rect x="545" y="1110" width="310" height="68" fill="#ffffff" stroke="none"/>
  <ellipse cx="700" cy="1110" rx="155" ry="30" class="db-fill"/>
  <path d="M 545 1110 L 545 1178 M 855 1110 L 855 1178" fill="none" stroke="#486581" stroke-width="1.8"/>
  <path d="M 545 1178 A 155 30 0 0 0 855 1178" fill="none" stroke="#486581" stroke-width="1.8"/>
  <text x="700" y="1150" text-anchor="middle" class="text">PostgreSQL + PostGIS</text>

  <polyline points="300,292 300,335 230,335 230,355" class="arrow-public"/>
  <polyline points="300,292 300,335 460,335 460,355" class="arrow-public"/>
  <polyline points="300,292 300,335 690,335 690,355" class="arrow-public"/>

