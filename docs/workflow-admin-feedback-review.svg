<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f2742; }
      .subtitle { font: 600 14px Arial, sans-serif; fill: #52667a; }
      .lane { fill: #f8fbff; stroke: #8ca0b3; stroke-width: 1.5; }
      .header { fill: #e7f0f8; stroke: #8ca0b3; stroke-width: 1.5; }
      .lane-title { font: 700 16px Arial, sans-serif; fill: #16324f; }
      .step { fill: #ffffff; stroke: #44627d; stroke-width: 1.8; rx: 10; ry: 10; }
      .decision { fill: #fffdf5; stroke: #b08800; stroke-width: 1.8; }
      .term { fill: #f3f7fb; stroke: #334e68; stroke-width: 1.8; }
      .text { font: 600 13px Arial, sans-serif; fill: #243b53; }
      .flow { stroke: #334e68; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334e68"/>
    </marker>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">Use Case Workflow: Admin Feedback Review</text>
  <text x="600" y="60" text-anchor="middle" class="subtitle">Admins review citizen feedback, change status, and sync the latest review state</text>

  <rect x="40" y="90" width="220" height="600" class="lane"/>
  <rect x="260" y="90" width="220" height="600" class="lane"/>
  <rect x="480" y="90" width="220" height="600" class="lane"/>
  <rect x="700" y="90" width="220" height="600" class="lane"/>
  <rect x="920" y="90" width="220" height="600" class="lane"/>

  <rect x="40" y="90" width="220" height="48" class="header"/>
  <rect x="260" y="90" width="220" height="48" class="header"/>
  <rect x="480" y="90" width="220" height="48" class="header"/>
  <rect x="700" y="90" width="220" height="48" class="header"/>
  <rect x="920" y="90" width="220" height="48" class="header"/>

  <text x="150" y="120" text-anchor="middle" class="lane-title">Admin</text>
  <text x="370" y="120" text-anchor="middle" class="lane-title">Frontend</text>
  <text x="590" y="120" text-anchor="middle" class="lane-title">Express Backend</text>
  <text x="810" y="120" text-anchor="middle" class="lane-title">Auth Middleware</text>
  <text x="1030" y="120" text-anchor="middle" class="lane-title">PostGIS</text>

  <ellipse cx="150" cy="180" rx="42" ry="20" class="term"/>
  <text x="150" y="185" text-anchor="middle" class="text">Start</text>

  <rect x="80" y="230" width="140" height="48" class="step"/>
  <text x="150" y="252" text-anchor="middle" class="text">Open review</text>
  <text x="150" y="268" text-anchor="middle" class="text">panel</text>

  <rect x="300" y="230" width="140" height="48" class="step"/>
  <text x="370" y="252" text-anchor="middle" class="text">Request feedback</text>
  <text x="370" y="268" text-anchor="middle" class="text">queue</text>

  <rect x="520" y="230" width="140" height="48" class="step"/>
  <text x="590" y="252" text-anchor="middle" class="text">Receive review</text>
  <text x="590" y="268" text-anchor="middle" class="text">request</text>

  <rect x="740" y="230" width="140" height="48" class="step"/>
  <text x="810" y="252" text-anchor="middle" class="text">Check token</text>
  <text x="810" y="268" text-anchor="middle" class="text">and role</text>

  <rect x="960" y="230" width="140" height="48" class="step"/>
  <text x="1030" y="252" text-anchor="middle" class="text">Fetch feedback</text>
  <text x="1030" y="268" text-anchor="middle" class="text">records</text>

  <rect x="300" y="340" width="140" height="48" class="step"/>
  <text x="370" y="362" text-anchor="middle" class="text">Render review</text>
  <text x="370" y="378" text-anchor="middle" class="text">queue</text>

  <rect x="80" y="430" width="140" height="48" class="step"/>
  <text x="150" y="452" text-anchor="middle" class="text">Select case</text>
  <text x="150" y="468" text-anchor="middle" class="text">and status</text>

  <rect x="300" y="430" width="140" height="48" class="step"/>
  <text x="370" y="452" text-anchor="middle" class="text">Submit review</text>
  <text x="370" y="468" text-anchor="middle" class="text">update</text>

  <rect x="520" y="430" width="140" height="48" class="step"/>
  <text x="590" y="452" text-anchor="middle" class="text">Validate update</text>
  <text x="590" y="468" text-anchor="middle" class="text">payload</text>

  <polygon points="810,414 870,454 810,494 750,454" class="decision"/>
  <text x="810" y="450" text-anchor="middle" class="text">Allowed</text>
  <text x="810" y="466" text-anchor="middle" class="text">update?</text>

  <rect x="960" y="430" width="140" height="48" class="step"/>
  <text x="1030" y="452" text-anchor="middle" class="text">Persist status</text>
  <text x="1030" y="468" text-anchor="middle" class="text">and remarks</text>

  <rect x="300" y="520" width="140" height="48" class="step"/>
  <text x="370" y="542" text-anchor="middle" class="text">Show access</text>
  <text x="370" y="558" text-anchor="middle" class="text">error</text>

  <rect x="300" y="590" width="140" height="48" class="step"/>
  <text x="370" y="612" text-anchor="middle" class="text">Refresh review</text>
  <text x="370" y="628" text-anchor="middle" class="text">list</text>

  <ellipse cx="590" cy="660" rx="42" ry="20" class="term"/>
  <text x="590" y="665" text-anchor="middle" class="text">End</text>

  <line x1="150" y1="200" x2="150" y2="230" class="flow"/>
  <line x1="220" y1="254" x2="300" y2="254" class="flow"/>
  <line x1="440" y1="254" x2="520" y2="254" class="flow"/>
  <line x1="660" y1="254" x2="740" y2="254" class="flow"/>
  <line x1="880" y1="254" x2="960" y2="254" class="flow"/>
  <polyline points="1030,278 1030,364 440,364" class="flow"/>
  <polyline points="370,388 370,410 150,410 150,430" class="flow"/>
  <line x1="220" y1="454" x2="300" y2="454" class="flow"/>
  <line x1="440" y1="454" x2="520" y2="454" class="flow"/>
  <line x1="660" y1="454" x2="750" y2="454" class="flow"/>
  <text x="720" y="438" class="text">No</text>
  <polyline points="750,454 700,454 700,544 440,544" class="flow"/>
  <polyline points="300,544 240,544 240,254 220,254" class="flow"/>

  <text x="884" y="444" class="text">Yes</text>
  <line x1="870" y1="454" x2="960" y2="454" class="flow"/>
  <polyline points="1030,478 1030,614 440,614" class="flow"/>
  <polyline points="370,638 370,660 548,660" class="flow"/>
</svg>
