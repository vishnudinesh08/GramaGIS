<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f2742; }
      .subtitle { font: 600 14px Arial, sans-serif; fill: #52667a; }
      .lane { fill: #f8fbff; stroke: #8ca0b3; stroke-width: 1.5; }
      .header { fill: #e7f0f8; stroke: #8ca0b3; stroke-width: 1.5; }
      .lane-title { font: 700 16px Arial, sans-serif; fill: #16324f; }
      .step { fill: #ffffff; stroke: #44627d; stroke-width: 1.8; rx: 10; ry: 10; }
      .decision { fill: #fffdf5; stroke: #b08800; stroke-width: 1.8; }
      .term { fill: #f3f7fb; stroke: #334e68; stroke-width: 1.8; }
      .text { font: 600 13px Arial, sans-serif; fill: #243b53; }
      .flow { stroke: #334e68; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334e68"/>
    </marker>
  </defs>
  <text x="650" y="38" text-anchor="middle" class="title">Use Case Workflow: Admin GIS Data Management</text>
  <text x="650" y="60" text-anchor="middle" class="subtitle">Authorized admins create, update, or delete village spatial features</text>
  <rect x="40" y="90" width="210" height="600" class="lane"/>
  <rect x="250" y="90" width="210" height="600" class="lane"/>
  <rect x="460" y="90" width="210" height="600" class="lane"/>
  <rect x="670" y="90" width="210" height="600" class="lane"/>
  <rect x="880" y="90" width="210" height="600" class="lane"/>
  <rect x="1090" y="90" width="170" height="600" class="lane"/>
  <rect x="40" y="90" width="210" height="48" class="header"/>
  <rect x="250" y="90" width="210" height="48" class="header"/>
  <rect x="460" y="90" width="210" height="48" class="header"/>
  <rect x="670" y="90" width="210" height="48" class="header"/>
  <rect x="880" y="90" width="210" height="48" class="header"/>
  <rect x="1090" y="90" width="170" height="48" class="header"/>
  <text x="145" y="120" text-anchor="middle" class="lane-title">Admin</text>
  <text x="355" y="120" text-anchor="middle" class="lane-title">Frontend</text>
  <text x="565" y="120" text-anchor="middle" class="lane-title">Express Backend</text>
  <text x="775" y="120" text-anchor="middle" class="lane-title">Auth Middleware</text>
  <text x="985" y="120" text-anchor="middle" class="lane-title">GeoServer WFS-T</text>
  <text x="1175" y="120" text-anchor="middle" class="lane-title">PostGIS</text>
  <ellipse cx="145" cy="180" rx="42" ry="20" class="term"/>
  <text x="145" y="185" text-anchor="middle" class="text">Start</text>
  <rect x="75" y="230" width="140" height="48" class="step"/>
  <text x="145" y="260" text-anchor="middle" class="text">Open edit tool</text>
  <rect x="75" y="320" width="140" height="48" class="step"/>
  <text x="145" y="342" text-anchor="middle" class="text">Choose layer</text>
  <text x="145" y="358" text-anchor="middle" class="text">and action</text>
  <rect x="285" y="320" width="140" height="48" class="step"/>
  <text x="355" y="342" text-anchor="middle" class="text">Prepare edit</text>
  <text x="355" y="358" text-anchor="middle" class="text">payload</text>
  <rect x="495" y="320" width="140" height="48" class="step"/>
  <text x="565" y="342" text-anchor="middle" class="text">Receive feature</text>
  <text x="565" y="358" text-anchor="middle" class="text">edit request</text>
  <rect x="705" y="320" width="140" height="48" class="step"/>
  <text x="775" y="342" text-anchor="middle" class="text">Check token</text>
  <text x="775" y="358" text-anchor="middle" class="text">and role</text>
  <polygon points="775,420 835,460 775,500 715,460" class="decision"/>
  <text x="775" y="456" text-anchor="middle" class="text">Allowed</text>
  <text x="775" y="472" text-anchor="middle" class="text">action?</text>
  <rect x="915" y="430" width="140" height="48" class="step"/>
  <text x="985" y="452" text-anchor="middle" class="text">Apply WFS-T</text>
  <text x="985" y="468" text-anchor="middle" class="text">transaction</text>
  <rect x="1105" y="430" width="140" height="48" class="step"/>
  <text x="1175" y="452" text-anchor="middle" class="text">Persist</text>
  <text x="1175" y="468" text-anchor="middle" class="text">geometry/data</text>
  <rect x="285" y="560" width="140" height="48" class="step"/>
  <text x="355" y="582" text-anchor="middle" class="text">Refresh layer</text>
  <text x="355" y="598" text-anchor="middle" class="text">view</text>
  <ellipse cx="565" cy="640" rx="42" ry="20" class="term"/>
  <text x="565" y="645" text-anchor="middle" class="text">End</text>
  <line x1="145" y1="200" x2="145" y2="230" class="flow"/>
  <line x1="145" y1="278" x2="145" y2="320" class="flow"/>
  <line x1="215" y1="344" x2="285" y2="344" class="flow"/>
  <line x1="425" y1="344" x2="495" y2="344" class="flow"/>
  <line x1="635" y1="344" x2="705" y2="344" class="flow"/>
  <polyline points="775,368 775,420" class="flow"/>
  <text x="710" y="446" class="text">No</text>
  <polyline points="715,460 675,460 675,584 425,584" class="flow"/>
  <text x="805" y="416" class="text">Yes</text>
  <line x1="835" y1="460" x2="915" y2="460" class="flow"/>
  <line x1="1055" y1="460" x2="1105" y2="460" class="flow"/>
  <polyline points="1175,478 1175,584 425,584" class="flow"/>
  <polyline points="355,608 355,640 523,640" class="flow"/>
</svg>
