<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f2742; }
      .subtitle { font: 600 14px Arial, sans-serif; fill: #52667a; }
      .lane { fill: #f8fbff; stroke: #8ca0b3; stroke-width: 1.5; }
      .header { fill: #e7f0f8; stroke: #8ca0b3; stroke-width: 1.5; }
      .lane-title { font: 700 16px Arial, sans-serif; fill: #16324f; }
      .step { fill: #ffffff; stroke: #44627d; stroke-width: 1.8; rx: 10; ry: 10; }
      .decision { fill: #fffdf5; stroke: #b08800; stroke-width: 1.8; }
      .term { fill: #f3f7fb; stroke: #334e68; stroke-width: 1.8; }
      .text { font: 600 13px Arial, sans-serif; fill: #243b53; }
      .small { font: 12px Arial, sans-serif; fill: #52667a; }
      .flow { stroke: #334e68; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334e68"/>
    </marker>
  </defs>
  <text x="700" y="38" text-anchor="middle" class="title">Use Case Workflow: Smart Query / Natural Language Search</text>
  <text x="700" y="60" text-anchor="middle" class="subtitle">Citizen or admin searches village assets using plain language</text>
  <rect x="40" y="90" width="210" height="620" class="lane"/>
  <rect x="250" y="90" width="210" height="620" class="lane"/>
  <rect x="460" y="90" width="210" height="620" class="lane"/>
  <rect x="670" y="90" width="210" height="620" class="lane"/>
  <rect x="880" y="90" width="210" height="620" class="lane"/>
  <rect x="1090" y="90" width="210" height="620" class="lane"/>
  <rect x="40" y="90" width="210" height="48" class="header"/>
  <rect x="250" y="90" width="210" height="48" class="header"/>
  <rect x="460" y="90" width="210" height="48" class="header"/>
  <rect x="670" y="90" width="210" height="48" class="header"/>
  <rect x="880" y="90" width="210" height="48" class="header"/>
  <rect x="1090" y="90" width="210" height="48" class="header"/>
  <text x="145" y="120" text-anchor="middle" class="lane-title">User</text>
  <text x="355" y="120" text-anchor="middle" class="lane-title">Frontend</text>
  <text x="565" y="120" text-anchor="middle" class="lane-title">Express Backend</text>
  <text x="775" y="120" text-anchor="middle" class="lane-title">Gemini</text>
  <text x="985" y="120" text-anchor="middle" class="lane-title">GeoServer</text>
  <text x="1195" y="120" text-anchor="middle" class="lane-title">PostGIS</text>
  <ellipse cx="145" cy="180" rx="42" ry="20" class="term"/>
  <text x="145" y="185" text-anchor="middle" class="text">Start</text>
  <rect x="75" y="230" width="140" height="48" class="step"/>
  <text x="145" y="260" text-anchor="middle" class="text">Enter query</text>
  <rect x="285" y="230" width="140" height="48" class="step"/>
  <text x="355" y="252" text-anchor="middle" class="text">Send search</text>
  <text x="355" y="268" text-anchor="middle" class="text">request</text>
  <rect x="495" y="230" width="140" height="48" class="step"/>
  <text x="565" y="252" text-anchor="middle" class="text">Validate input</text>
  <text x="565" y="268" text-anchor="middle" class="text">and context</text>
  <polygon points="565,320 625,360 565,400 505,360" class="decision"/>
  <text x="565" y="356" text-anchor="middle" class="text">Need AI</text>
  <text x="565" y="372" text-anchor="middle" class="text">parsing?</text>
  <rect x="705" y="336" width="140" height="48" class="step"/>
  <text x="775" y="358" text-anchor="middle" class="text">Convert NL</text>
  <text x="775" y="374" text-anchor="middle" class="text">to JSON/CQL</text>
  <rect x="495" y="450" width="140" height="48" class="step"/>
  <text x="565" y="472" text-anchor="middle" class="text">Build safe</text>
  <text x="565" y="488" text-anchor="middle" class="text">layer filter</text>
  <rect x="915" y="450" width="140" height="48" class="step"/>
  <text x="985" y="472" text-anchor="middle" class="text">Fetch filtered</text>
  <text x="985" y="488" text-anchor="middle" class="text">features</text>
  <rect x="1125" y="450" width="140" height="48" class="step"/>
  <text x="1195" y="480" text-anchor="middle" class="text">Read records</text>
  <rect x="285" y="560" width="140" height="48" class="step"/>
  <text x="355" y="582" text-anchor="middle" class="text">Render results</text>
  <text x="355" y="598" text-anchor="middle" class="text">and highlight</text>
  <ellipse cx="565" cy="650" rx="42" ry="20" class="term"/>
  <text x="565" y="655" text-anchor="middle" class="text">End</text>
  <line x1="145" y1="200" x2="145" y2="230" class="flow"/>
  <line x1="215" y1="254" x2="285" y2="254" class="flow"/>
  <line x1="425" y1="254" x2="495" y2="254" class="flow"/>
  <polyline points="565,278 565,320" class="flow"/>
  <polyline points="625,360 705,360" class="flow"/>
  <text x="650" y="344" class="small">Yes</text>
  <polyline points="845,360 875,360 875,474 635,474" class="flow"/>
  <text x="518" y="430" class="small">No</text>
  <polyline points="565,400 565,450" class="flow"/>
  <line x1="635" y1="474" x2="915" y2="474" class="flow"/>
  <line x1="1055" y1="474" x2="1125" y2="474" class="flow"/>
  <polyline points="1195,498 1195,584 425,584" class="flow"/>
  <polyline points="355,608 355,650 523,650" class="flow"/>
</svg>
